# Spec-First: reglas de arquitectura verificables (se automatizan con ArchUnit/Konsist en la fase de implementación).
# Garantizan que el monolito MVC de hoy pueda migrar a Hexagonal y luego a microservicios sin reescribir el dominio.
# Trazabilidad: docs/02_ARQUITECTURA.md §2, §4, §5
version: 1.0.0

modulos:
  core-domain:        { capa: dominio,        depende_de: [] }
  core-application:   { capa: aplicacion,     depende_de: [core-domain] }
  adapters-persistence: { capa: infraestructura, depende_de: [core-application, core-domain] }
  adapters-sunat:     { capa: infraestructura, depende_de: [core-application, core-domain] }
  adapters-legacy:    { capa: infraestructura, depende_de: [core-application, core-domain] }
  app-ui:             { capa: vista_controlador, depende_de: [core-application] }
  app-desktop:        { capa: arranque, depende_de: ['*'], empaquetado: MSI }
  app-android:        { capa: arranque, depende_de: ['*'], empaquetado: APK }

reglas:
  - id: ARQ-01
    descripcion: El dominio no depende de frameworks, UI, SQL, SOAP ni XML.
    paquetes: pe.abc.facturacion.domain..
    prohibido_importar: [androidx.., androidx.compose.., app.cash.sqldelight.., javax.xml.., jakarta.xml.., org.apache.santuario..]
  - id: ARQ-02
    descripcion: Los controladores MVC solo usan puertos de entrada y DTOs; nunca entidades ni repositorios.
    paquetes: pe.abc.facturacion.ui.controller..
    solo_puede_importar: [pe.abc.facturacion.application.port.input.., pe.abc.facturacion.application.dto..]
  - id: ARQ-03
    descripcion: Toda E/S pasa por un puerto de salida (specs/puertos/PuertosSalida.kt).
    paquetes: pe.abc.facturacion.application..
    prohibido_importar: [pe.abc.facturacion.adapters..]
  - id: ARQ-04
    descripcion: Los contextos acotados no se referencian directamente; se comunican por puertos públicos o eventos de dominio.
    contextos: [facturacion, maestros, inventario, migracion]
    permitido: [EventPublisherPort, interfaces en <contexto>.api]
  - id: ARQ-05
    descripcion: Cada contexto es dueño de sus tablas; no hay joins entre esquemas de contextos distintos.
    esquemas_bd: { facturacion: fac_, maestros: mae_, inventario: inv_, migracion: mig_ }
  - id: ARQ-06
    descripcion: Las entidades no se exponen fuera de core-*; la Vista recibe DTO/ViewState.
  - id: ARQ-07
    descripcion: Los catálogos SUNAT son value objects; ningún código fuera del dominio usa strings mágicos de catálogo.

evolucion:
  fase_1: { estilo: Monolito MVC modular, adaptadores_entrada: [app-ui], bd: SQLite local }
  fase_2: { estilo: Hexagonal + API REST, adaptadores_entrada: [app-ui, rest (specs/03_CONTRATOS_API.yaml)], bd: PostgreSQL central }
  fase_3:
    estilo: Microservicios por contexto
    servicios: [ms-facturacion, ms-maestros, ms-inventario, ms-integracion-sunat, ms-migracion]
    cambio_requerido: solo nuevos adaptadores (EventPublisherPort → broker, repositorios → BD propia)
